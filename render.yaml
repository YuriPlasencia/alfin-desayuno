# Blueprint de Render para Juntay (antes Juntada).
# En Render: New → Blueprint → elige este repositorio. Te pedirá el valor de TEAM_CODE.
services:
  - type: web
    name: alfin-desayuno
    runtime: node
    # El disco persistente (base SQLite) requiere un plan de pago; el gratis borra los datos.
    plan: starter
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      # Código del evento Al Fin Desayuno al pasar a Juntada (luego se cambia en Ajustes)
      - key: TEAM_CODE
        sync: false
      # Ingreso con Google (Google Cloud → Credenciales → ID de cliente OAuth web)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Entrar también con nombre y correo (además de Google): pon 1
      - key: NAME_LOGIN
        sync: false
      # Correo con el código para entrar (Resend, con el dominio juntay.pe verificado).
      # Sin esta clave no se envía ningún correo y el ingreso por correo queda apagado.
      - key: RESEND_API_KEY
        sync: false
      # Remitente (opcional; por defecto "Juntay <acceso@juntay.pe>")
      - key: MAIL_FROM
        sync: false
      # Lectura de boletas y constancias con Claude; sin clave o si falla, sigue el OCR
      - key: ANTHROPIC_API_KEY
        sync: false
      # Clave del panel /admin (tráfico y consumo de Claude); sin ella, /admin no existe
      - key: ADMIN_KEY
        sync: false
      # Dominio propio (p. ej. https://juntay.pe): la dirección .onrender.com redirige ahí
      - key: PUBLIC_URL
        sync: false
    disk:
      name: alfin-data
      mountPath: /data
      sizeGB: 1
