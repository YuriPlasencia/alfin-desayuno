<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F5F4F6;font-family:'Inter Tight',sans-serif;color:#16181A}
.bar{height:52px;border-bottom:1px solid #C9C7C4;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.big{font-size:92px;font-weight:400;letter-spacing:-.03em;line-height:1;padding:24px 18px 4px}
.lbl{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#55585C;padding:0 18px}
.rule{border-top:1px solid #C9C7C4;margin:18px 18px 0}
.item{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #C9C7C4;font-size:16px}
.item span{font-family:'JetBrains Mono';font-size:11px;color:#55585C}
.stamp{position:absolute;right:22px;top:150px;width:96px;height:96px;border-radius:50%;background:#DCDDF3;display:grid;place-items:center;font-family:'JetBrains Mono';font-size:10px;text-align:center;letter-spacing:.1em}
.nav{position:absolute;bottom:0;left:0;right:0;height:60px;border-top:1px solid #C9C7C4;display:flex;justify-content:space-around;align-items:center;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase}
</style></head><body>
<div class="bar"><span>Al Fin Desayuno</span><span>21.11 · 08:30</span></div>
<p class="big">38%</p><p class="lbl">avance del equipo · 18/47 pasos</p>
<div class="stamp">FIRMADO<br>POR<br>DIEGO H.</div>
<div class="rule"></div>
<p class="lbl" style="margin-top:14px">Lo tuyo, Ana</p>
<div class="item">Horario de llegada<span>HECHO</span></div>
<div class="item">Orden de servicio por mesa<span>5 D</span></div>
<div class="item">Enviar cronograma al grupo<span>5 D</span></div>
<p class="lbl" style="margin-top:18px">Próximos</p>
<div class="item">Menú final y cantidades<span>2 D</span></div>
<div class="item">Invitaciones<span>6 D</span></div>
<div class="nav"><b>Inicio</b><span>Tareas</span><span>Acuerdos</span><span>Equipo</span><span>Caja</span></div>
</body></html>
