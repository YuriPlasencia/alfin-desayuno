<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Juntay · Administración</title>
<style>
  :root {
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --line: #e2e8f0; --line-strong: #cbd5e1;
    --bg: #f1f4fb; --board: #fff; --well: #f1f5f9; --blue: #1d3fbf; --blue-soft: #e8edfc;
    --series-a: #1d3fbf; --series-b: #eb6834; --red: #b91c1c; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  h1 span { color: var(--blue); }
  h2 { margin: 0; font-size: 16px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select { padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; font: inherit; background: #fff; color: var(--ink); }
  button { padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:hover { border-color: var(--blue); }
  .card { background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .card > * { min-width: 0; }
  .login { max-width: 440px; margin: 10vh auto 0; }
  .msg { min-height: 22px; color: var(--red); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; }
  .tile b { font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile small { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; align-items: start; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 20px rgba(15,23,42,.1); font-variant-numeric: tabular-nums; }
  .rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .rank li { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .rank .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .track { height: 10px; }
  .rank .track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--series-a); min-width: 2px; }
  .rank .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .funnel li { grid-template-columns: minmax(150px, 210px) 1fr auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; white-space: nowrap; user-select: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .nowrap { white-space: nowrap; }
  .empty { padding: 20px; text-align: center; color: var(--muted); }
  .sub { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill.near { background: #fdf2e1; color: #92400e; }
  .pill.over { background: #fdeceb; color: #b42d21; }
  .cohort td.cell { text-align: center; font-variant-numeric: tabular-nums; min-width: 52px; border: 2px solid #fff; border-radius: 6px; }
  .cohort td.na { background: transparent; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--well); color: var(--ink-2); }
  .badge.live { background: #e3f4ea; color: #166534; }
  .note { background: var(--blue-soft); color: #1e3a8a; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .rank li, .funnel li { grid-template-columns: 1fr auto; }
    .rank .track { grid-column: 1 / -1; grid-row: 2; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<main id="app">
  <form class="card login" id="login">
    <h1>Juntay <span>·</span> Administración</h1>
    <p class="muted">Visitas, personas activas, ingreso, eventos, lecturas con Claude e historial de Juntay.</p>
    <label>Clave de administración<br><input id="key" type="password" autocomplete="current-password" style="width:100%"></label>
    <div><button class="primary" type="submit">Entrar</button></div>
    <p class="msg" id="msg"></p>
  </form>
</main>
<script>
(() => {
  const app = document.getElementById('app')
  const nf = new Intl.NumberFormat('es-PE')
  const fmt = (n) => nf.format(n || 0)
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—')
  const usd = (n) => 'US$ ' + (n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: n && n < 1 ? 4 : 2 })
  const READS = { a: 'ia', b: 'ocr', label: 'Lecturas con Claude y con el OCR por día', tip: (d) => fmt(d.ia) + ' con Claude · ' + fmt(d.ocr) + ' con OCR · ' + fmt(d.tokens) + ' tokens · ' + usd(d.cost) }
  const ACTIVE = { a: 'active', b: 'signups', label: 'Personas activas y cuentas nuevas por día', tip: (d) => fmt(d.active) + ' activas · ' + fmt(d.signups) + ' cuentas nuevas' }
  const CODES = { a: 'sent', b: 'ok', label: 'Códigos enviados y usados para entrar por día', tip: (d) => fmt(d.sent) + ' enviados · ' + fmt(d.ok) + ' usados para entrar' }
  let key = ''
  try { key = sessionStorage.getItem('juntay.admin') || '' } catch {}
  let days = 30
  let data = null
  let search = ''
  let sort = { col: 'first', dir: -1 }

  // Arma nodos con textContent: los nombres los escribe la gente, nunca van como HTML.
  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v)
      else if (v !== false && v != null) node.setAttribute(k, v)
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid instanceof Node ? kid : String(kid))
    return node
  }
  const svg = (tag, attrs) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag)
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v)
    return node
  }
  const dateTime = (iso) => (iso ? new Date(iso).toLocaleString('es-PE', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '')
  const dateOnly = (iso) => (iso ? new Date(iso).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' }) : '')

  async function call(path) {
    const r = await fetch(path, { headers: { 'x-admin-key': key } })
    if (r.status === 401) throw Object.assign(new Error('Clave incorrecta.'), { auth: true })
    if (r.status === 429) throw Object.assign(new Error('Demasiados intentos. Espera unos minutos.'), { auth: true })
    if (!r.ok) throw new Error('Error ' + r.status)
    return r
  }

  async function load() {
    try {
      data = await (await call('/api/admin/resumen?dias=' + days)).json()
      try { sessionStorage.setItem('juntay.admin', key) } catch {}
      render()
    } catch (err) {
      if (err.auth) { try { sessionStorage.removeItem('juntay.admin') } catch {} ; key = '' ; showLogin(err.message) }
      else alert(err.message)
    }
  }

  function showLogin(message) {
    const form = document.getElementById('login')
    if (!form) location.reload()
    document.getElementById('msg').textContent = message || ''
  }

  async function download(name) {
    const r = await call('/api/admin/' + name + '.csv')
    const a = el('a', { href: URL.createObjectURL(await r.blob()), download: 'juntay-' + name + '-' + new Date().toISOString().slice(0, 10) + '.csv' })
    a.click()
  }

  function tile(label, value, hint) {
    return el('div', { class: 'tile' }, el('small', {}, label), el('b', {}, value), hint ? el('span', { class: 'muted small' }, hint) : null)
  }

  function rank(rows, labelKey, valueKey, extra) {
    if (!rows.length) return el('p', { class: 'empty' }, 'Todavía no hay datos.')
    const max = Math.max(...rows.map((r) => r[valueKey]), 1)
    return el('ul', { class: 'rank' }, rows.map((r) =>
      el('li', {},
        el('span', { class: 'label', title: r[labelKey] }, r[labelKey] || '—'),
        el('span', { class: 'track' }, el('i', { style: 'width:' + (r[valueKey] / max) * 100 + '%' })),
        el('span', { class: 'val' }, fmt(r[valueKey]), extra ? el('span', { class: 'muted' }, ' ' + extra(r)) : null))))
  }

  // Visitantes (barras) y registros (línea) por día, en la misma escala.
  const VISITS = { a: 'visitors', b: 'signups', label: 'Visitantes y registros por día', tip: (d) => fmt(d.visitors) + ' visitantes · ' + fmt(d.signups) + ' registros' }
  function trend(daily, width, cfg = VISITS) {
    const wrap = el('div', { class: 'chart' })
    const W = Math.max(width || 640, 300), H = 220, L = 34, R = 8, T = 12, B = 26
    const A = cfg.a, B2 = cfg.b
    const max = Math.max(...daily.map((d) => Math.max(d[A], d[B2])), 1)
    const step = niceStep(max)
    const top = Math.ceil(max / step) * step
    const s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': cfg.label })
    const y = (v) => T + (H - T - B) * (1 - v / top)
    const bw = (W - L - R) / daily.length
    for (let v = 0; v <= top; v += step) {
      s.append(svg('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v ? '#e2e8f0' : '#cbd5e1' }))
      const t = svg('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'tick' }); t.textContent = fmt(v); s.append(t)
    }
    const every = Math.ceil(daily.length / 8)
    const band = svg('rect', { y: T, height: H - T - B, width: bw, fill: '#f1f5f9', opacity: 0 })
    s.append(band)
    daily.forEach((d, i) => {
      const x = L + i * bw
      const h = (H - T - B) * (d[A] / top)
      if (d[A]) s.append(svg('rect', { x: x + bw * 0.18, width: Math.max(bw * 0.64, 1), y: y(d[A]), height: h, rx: Math.min(3, bw * 0.2), fill: 'var(--series-a)' }))
      if (i % every === 0) {
        const t = svg('text', { x: x + bw / 2, y: H - 8, 'text-anchor': 'middle', class: 'tick' })
        t.textContent = d.day.slice(8, 10) + '/' + d.day.slice(5, 7); s.append(t)
      }
    })
    const pts = daily.map((d, i) => (L + i * bw + bw / 2) + ',' + y(d[B2])).join(' ')
    s.append(svg('polyline', { points: pts, fill: 'none', stroke: 'var(--series-b)', 'stroke-width': 2, 'stroke-linejoin': 'round' }))
    daily.forEach((d, i) => { if (d[B2]) s.append(svg('circle', { cx: L + i * bw + bw / 2, cy: y(d[B2]), r: 3.5, fill: 'var(--series-b)', stroke: '#fff', 'stroke-width': 1.5 })) })
    const tip = el('div', { class: 'tip', hidden: true })
    const hit = svg('rect', { x: L, y: 0, width: W - L - R, height: H, fill: 'transparent' })
    hit.addEventListener('mousemove', (e) => {
      const box = s.getBoundingClientRect()
      const i = Math.min(daily.length - 1, Math.max(0, Math.floor(((e.clientX - box.left) * (W / box.width) - L) / bw)))
      const d = daily[i]
      band.setAttribute('x', L + i * bw); band.setAttribute('opacity', 1)
      tip.hidden = false
      tip.replaceChildren(el('b', {}, dateOnly(d.day + 'T12:00:00')), el('br'), cfg.tip(d))
      tip.style.left = ((L + i * bw + bw / 2) / W) * 100 + '%'
    })
    hit.addEventListener('mouseleave', () => { tip.hidden = true; band.setAttribute('opacity', 0) })
    s.append(hit)
    wrap.append(s, tip)
    return wrap
  }
  function niceStep(max) {
    const raw = max / 4
    const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)))
    return Math.max(1, [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw) || mag * 10)
  }

  function peopleTable() {
    const q = search.trim().toLowerCase()
    const rows = data.people
      .filter((p) => !q || (p.name + ' ' + p.email + ' ' + p.source + ' ' + p.event_names).toLowerCase().includes(q))
      .sort((a, b) => {
        const va = a[sort.col], vb = b[sort.col]
        return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb))) * sort.dir
      })
    const cols = [
      ['name', 'Nombre'], ['email', 'Correo'], ['source', 'Llegó desde', 'hide-sm'], ['first', 'Primera vez'],
      ['last_activity', 'Última actividad', 'hide-sm'], ['events', 'Eventos', 'num'], ['actions', 'Acciones', 'num hide-sm'], ['news', 'Novedades', 'hide-sm'],
    ]
    const head = el('tr', {}, cols.map(([c, label, cls]) => el('th', {
      class: cls || '', 'aria-sort': sort.col === c ? (sort.dir > 0 ? 'ascending' : 'descending') : false,
      onclick: () => { sort = { col: c, dir: sort.col === c ? -sort.dir : 1 }; renderPeople() },
    }, label + (sort.col === c ? (sort.dir > 0 ? ' ↑' : ' ↓') : ''))))
    const body = rows.length
      ? rows.map((p) => el('tr', {},
          el('td', {}, p.name || '—'), el('td', {}, p.email || el('span', { class: 'muted' }, 'sin correo')),
          el('td', { class: 'hide-sm' }, p.source || el('span', { class: 'muted' }, 'antes del registro')),
          el('td', { class: 'nowrap' }, dateOnly(p.first)), el('td', { class: 'nowrap hide-sm' }, dateTime(p.last_activity)),
          el('td', { class: 'num' }, fmt(p.events)), el('td', { class: 'num hide-sm' }, fmt(p.actions)), el('td', { class: 'hide-sm' }, p.news)))
      : [el('tr', {}, el('td', { colspan: cols.length, class: 'empty' }, 'Nadie coincide con la búsqueda.'))]
    return el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, head), el('tbody', {}, body)), el('p', { class: 'muted small', style: 'margin-top:8px' }, fmt(rows.length) + ' de ' + fmt(data.people.length) + ' personas'))
  }
  let peopleBox = null
  function renderPeople() { if (peopleBox) peopleBox.replaceChildren(peopleTable()) }

  // Lecturas de boletas y constancias: quién leyó, cuánto consumió y cuánto lleva cada persona.
  function usageSection() {
    const a = data.ai
    if (!a) return null
    const t = a.totals, life = a.lifetime
    const perRead = t.ia ? t.cost / t.ia : 0
    const rows = a.users
    const table = rows.length
      ? el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Nombre'), el('th', {}, 'Correo'), el('th', { class: 'num' }, 'Fotos leídas'),
            el('th', { class: 'num hide-sm' }, 'Constancias'), el('th', { class: 'num hide-sm' }, 'Boletas'), el('th', { class: 'num' }, 'Con Claude'),
            el('th', { class: 'num' }, 'Gratis que le quedan'), el('th', { class: 'num hide-sm' }, 'En el periodo'), el('th', { class: 'num hide-sm' }, 'Tokens'),
            el('th', { class: 'num' }, 'Costo'), el('th', { class: 'hide-sm' }, 'Última lectura'))),
          el('tbody', {}, rows.map((u) => el('tr', {},
            el('td', {}, u.name || '—'), el('td', {}, u.email || el('span', { class: 'muted' }, 'sin correo')),
            el('td', { class: 'num' }, el('b', {}, fmt(u.reads))),
            el('td', { class: 'num hide-sm' }, fmt(u.proofs)), el('td', { class: 'num hide-sm' }, fmt(u.receipts)),
            el('td', { class: 'num' }, fmt(u.ia)),
            el('td', { class: 'num' }, u.over ? el('span', { class: 'pill over' }, 'Pasó por ' + fmt(u.over)) : u.left <= a.free * 0.1 ? el('span', { class: 'pill near' }, fmt(u.left)) : fmt(u.left)),
            el('td', { class: 'num hide-sm' }, fmt(u.recent)), el('td', { class: 'num hide-sm' }, fmt(u.tokens)),
            el('td', { class: 'num' }, usd(u.cost)), el('td', { class: 'nowrap hide-sm' }, dateTime(u.last)))))))
      : el('p', { class: 'empty' }, 'Todavía nadie subió una boleta o constancia.')
    return el('section', { class: 'card' },
      el('div', { class: 'bar' }, el('h2', {}, 'Lecturas y consumo de Claude'),
        el('button', { onclick: () => download('lecturas') }, 'Descargar lecturas')),
      a.enabled ? null : el('p', { class: 'note' }, 'Falta ANTHROPIC_API_KEY: todas las lecturas se hacen con el OCR y no consumen tokens.'),
      life.since
        ? el('p', { class: 'muted small' }, 'Se registran desde el ' + dateTime(life.since) + '. En total: ' + fmt(life.ia) + ' lecturas con Claude, ' + fmt(life.input + life.output) + ' tokens, ' + usd(life.cost) + '. El costo es un estimado con el precio de lista del modelo.')
        : el('p', { class: 'muted small' }, 'Cada boleta, constancia o cotización que alguien suba aparecerá aquí, con sus tokens y su costo.'),
      el('div', { class: 'tiles' },
        tile('Lecturas', fmt(t.reads), fmt(t.ia) + ' con Claude · ' + fmt(t.ocr) + ' con OCR' + (t.failed ? ' · ' + fmt(t.failed) + ' sin lectura' : '')),
        tile('Tokens', fmt(t.input + t.output), fmt(t.input) + ' de entrada · ' + fmt(t.output) + ' de salida'),
        tile('Costo estimado', usd(t.cost), t.ia ? usd(perRead) + ' por lectura con Claude' : 'en el periodo'),
        tile('Respuesta de Claude', t.ia ? (t.avgMs / 1000).toFixed(1) + ' s' : '—', 'tiempo promedio por lectura'),
        tile('Pasaron las ' + fmt(a.free) + ' gratis', fmt(a.overLimit), 'personas, en total')),
      el('div', { class: 'bar' }, el('h2', {}, 'Lecturas por día'),
        el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--series-a)' }), 'Con Claude'), el('span', {}, el('i', { style: 'background:var(--series-b)' }), 'Con OCR (respaldo)'))),
      el('div', { id: 'reads' }),
      el('div', { class: 'grid' },
        el('div', { class: 'sub' }, el('h2', {}, 'Qué se lee'), el('p', { class: 'muted small' }, 'Constancias y cotizaciones vienen de los eventos; las boletas, de Mis finanzas.'), rank(a.kinds, 'label', 'reads', (r) => '· ' + usd(r.cost))),
        el('div', { class: 'sub' }, el('h2', {}, 'Cuando Claude no pudo'),
          el('p', { class: 'muted small' }, 'Llamadas a Claude que fallaron o no sirvieron; esas lecturas las hizo el OCR.'),
          a.claudeErrors.length ? rank(a.claudeErrors, 'label', 'n') : el('p', { class: 'empty' }, 'Sin fallas en el periodo.'))),
      el('h2', {}, 'Fotos leídas por persona'),
      el('p', { class: 'muted small' }, 'Fotos y PDF leídos de cada persona desde el inicio: constancias y cotizaciones de sus eventos, y boletas de Mis finanzas. Las primeras ' + fmt(a.free) + ' lecturas con Claude son gratis; hoy no se cobra ni se corta al pasarlas.'),
      table)
  }


  // ---------- Personas activas y retención ----------
  function activeSection() {
    const a = data.active
    if (!a) return null
    const t = a.totals
    return el('section', { class: 'card' },
      el('h2', {}, 'Personas activas'),
      el('p', { class: 'muted small' }, 'Cuentas que abrieron Juntay con su sesión o hicieron algo en ella. Una persona cuenta una vez por día.'),
      el('div', { class: 'tiles' },
        tile('Hoy', fmt(t.today)),
        tile('Últimos 7 días', fmt(t.week), pct(t.week, t.people) + ' de todas las cuentas'),
        tile('Últimos 30 días', fmt(t.month), pct(t.month, t.people) + ' de todas las cuentas'),
        tile('Volvieron', fmt(t.returning), 'activas en el periodo, con cuenta de antes'),
        tile('Cambiaron algo', fmt(t.editors), 'en un evento, en el periodo')),
      el('div', { class: 'bar' }, el('h2', {}, 'Por día'),
        el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--series-a)' }), 'Activas'), el('span', {}, el('i', { style: 'background:var(--series-b)' }), 'Cuentas nuevas'))),
      el('div', { id: 'active' }),
      retentionTable())
  }

  function retentionTable() {
    const r = data.retention
    const title = el('h2', {}, 'Retención por semana de registro')
    if (!r || !r.cohorts.some((c) => c.size)) return el('div', { class: 'sub' }, title, el('p', { class: 'empty' }, 'Todavía no hay cuentas nuevas en las últimas semanas.'))
    const head = el('tr', {}, el('th', {}, 'Semana del'), el('th', { class: 'num' }, 'Cuentas'), Array.from({ length: r.weeks - 1 }, (_, i) => el('th', { class: 'num' }, 'Sem. ' + (i + 1))))
    const rows = r.cohorts.map((c) => el('tr', {},
      el('td', { class: 'nowrap' }, dateOnly(c.week + 'T12:00:00')),
      el('td', { class: 'num' }, fmt(c.size)),
      Array.from({ length: r.weeks - 1 }, (_, i) => {
        if (i >= c.back.length || !c.size) return el('td', { class: 'cell na' }, '')
        const share = c.back[i] / c.size
        return el('td', {
          class: 'cell', title: fmt(c.back[i]) + ' de ' + fmt(c.size) + ' volvieron',
          style: 'background:rgba(29,63,191,' + (0.06 + share * 0.84).toFixed(2) + ');color:' + (share > 0.45 ? '#fff' : 'var(--ink)'),
        }, Math.round(share * 100) + '%')
      })))
    return el('div', { class: 'sub' }, title,
      el('p', { class: 'muted small' }, 'De quienes crearon su cuenta cada semana (de lunes a domingo), qué parte volvió a usar Juntay 1, 2, 3… semanas después. No depende del periodo elegido.'),
      el('div', { class: 'scroll' }, el('table', { class: 'cohort' }, el('thead', {}, head), el('tbody', {}, rows))))
  }

  // ---------- Ingreso: Google y código por correo ----------
  function loginSection() {
    const l = data.login
    if (!l) return null
    const c = l.codes
    const stuck = l.stuck.length
      ? el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Nombre'), el('th', {}, 'Correo'), el('th', { class: 'num' }, 'Códigos'), el('th', {}, 'Último'), el('th', { class: 'hide-sm' }, 'Falla del envío'))),
          el('tbody', {}, l.stuck.map((p) => el('tr', {},
            el('td', {}, p.name || '—'), el('td', {}, p.email), el('td', { class: 'num' }, fmt(p.codes)),
            el('td', { class: 'nowrap' }, dateTime(p.last)), el('td', { class: 'hide-sm muted small' }, p.error || '—'))))))
      : el('p', { class: 'empty' }, 'Todos los que pidieron un código lograron entrar.')
    return el('section', { class: 'card' },
      el('h2', {}, 'Ingreso'),
      el('p', { class: 'muted small' }, 'Cómo entra la gente y si los correos con el código sirven. Los códigos se miden desde el ' + dateTime(l.statsSince)),
      el('div', { class: 'tiles' },
        tile('Códigos enviados', fmt(c.sent), fmt(c.people) + ' correos distintos'),
        tile('Entraron con el código', fmt(c.peopleOk), pct(c.peopleOk, c.people) + ' de quienes lo pidieron'),
        tile('Vencieron sin usarse', fmt(c.unused), 'el correo no llegó o no lo abrieron'),
        tile('Demasiados intentos', fmt(c.blocked), 'escribieron mal el código 5 veces'),
        tile('No se pudieron enviar', fmt(c.failed), c.failed ? 'revisa Resend' : 'sin fallas')),
      el('div', { class: 'bar' }, el('h2', {}, 'Por día'),
        el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--series-a)' }), 'Enviados'), el('span', {}, el('i', { style: 'background:var(--series-b)' }), 'Usados para entrar'))),
      el('div', { id: 'codes' }),
      el('div', { class: 'grid' },
        el('div', { class: 'sub' }, el('h2', {}, 'Cuentas por forma de entrar'),
          el('p', { class: 'muted small' }, 'Todas las cuentas; entre paréntesis, las nuevas del periodo.'),
          rank(l.accounts, 'label', 'n', (r) => '(' + fmt((l.newAccounts.find((x) => x.label === r.label) || {}).n || 0) + ' nuevas)')),
        el('div', { class: 'sub' }, el('h2', {}, 'Inicios de sesión en el periodo'), rank(l.logins.map((r) => ({ ...r, label: r.label.charAt(0).toUpperCase() + r.label.slice(1) })), 'label', 'n'))),
      l.sendErrors.length ? el('div', { class: 'sub' }, el('h2', {}, 'Por qué no se enviaron'), rank(l.sendErrors, 'label', 'n')) : null,
      el('h2', {}, 'Pidieron código y no entraron'),
      el('p', { class: 'muted small' }, 'En el periodo. Si son muchos, el correo puede estar cayendo en spam.'),
      stuck)
  }

  // ---------- Eventos ----------
  function eventsSection() {
    const e = data.events
    if (!e) return null
    const t = e.totals
    const table = e.rows.length
      ? el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Evento'), el('th', { class: 'hide-sm' }, 'Organiza'), el('th', { class: 'num' }, 'Equipo'),
            el('th', { class: 'num' }, 'Actividades hechas'), el('th', { class: 'num' }, 'Cambios'), el('th', { class: 'num hide-sm' }, 'Quiénes'),
            el('th', { class: 'num hide-sm' }, 'Fotos leídas'), el('th', {}, 'Último cambio'), el('th', { class: 'hide-sm' }, 'Qué usan'))),
          el('tbody', {}, e.rows.map((r) => el('tr', {},
            el('td', {}, el('b', {}, r.name), el('br'), el('span', { class: 'muted small' }, [r.category, r.type, r.date ? 'para el ' + dateOnly(r.date + 'T12:00:00') : ''].filter(Boolean).join(' · '))),
            el('td', { class: 'hide-sm' }, r.organizer || '—'),
            el('td', { class: 'num' }, fmt(r.people), el('br'), el('span', { class: 'muted small' }, fmt(r.accounts) + ' con cuenta')),
            el('td', { class: 'num' }, r.tasks ? fmt(r.tasksDone) + ' de ' + fmt(r.tasks) : '—'),
            el('td', { class: 'num' }, fmt(r.changes), el('br'), r.changesWeek ? el('span', { class: 'badge live' }, fmt(r.changesWeek) + ' esta semana') : el('span', { class: 'muted small' }, 'nada esta semana')),
            el('td', { class: 'num hide-sm' }, fmt(r.editors)),
            el('td', { class: 'num hide-sm' }, fmt(r.reads)),
            el('td', { class: 'nowrap' }, r.last ? dateTime(r.last) : el('span', { class: 'muted' }, 'sin cambios')),
            el('td', { class: 'hide-sm small' }, r.parts.join(', ') || el('span', { class: 'muted' }, '—')))))))
      : el('p', { class: 'empty' }, 'Todavía no hay eventos.')
    return el('section', { class: 'card' },
      el('h2', {}, 'Uso por evento'),
      el('p', { class: 'muted small' }, 'Cambios: todo lo que el equipo agregó, marcó o editó en el periodo. «Quiénes» cuenta a las personas distintas que hicieron esos cambios.'),
      el('div', { class: 'tiles' },
        tile('Eventos', fmt(t.events)),
        tile('Vivos esta semana', fmt(t.alive), pct(t.alive, t.events) + ' con cambios en 7 días'),
        tile('Con cambios en el periodo', fmt(t.activeInPeriod)),
        tile('Cambios en el periodo', fmt(t.changes))),
      el('div', { class: 'sub' }, el('h2', {}, 'Qué partes se usan'), el('p', { class: 'muted small' }, 'Cambios en el periodo, sumando todos los eventos.'), rank(e.parts, 'label', 'n')),
      table)
  }

  function render() {
    const t = data.totals, f = data.funnel
    peopleBox = el('div', {}, peopleTable())
    const period = el('select', { 'aria-label': 'Periodo', onchange: (e) => { days = Number(e.target.value); load() } },
      [[7, 'Últimos 7 días'], [30, 'Últimos 30 días'], [90, 'Últimos 90 días'], [365, 'Último año']].map(([v, l]) => el('option', { value: v, selected: v === days ? '' : false }, l)))

    app.replaceChildren(
      el('div', { class: 'bar' },
        el('h1', {}, 'Juntay ', el('span', {}, '·'), ' Administración'),
        el('div', { class: 'row' }, period,
          el('button', { onclick: load }, 'Actualizar'),
          el('button', { onclick: () => { try { sessionStorage.removeItem('juntay.admin') } catch {} ; location.reload() } }, 'Salir'))),
      t.trackingSince
        ? el('p', { class: 'muted small' }, 'Las visitas se registran desde el ' + dateTime(t.trackingSince) + ' · Personas e historial incluyen todo lo anterior.')
        : el('p', { class: 'note' }, 'Todavía no hay visitas registradas: se empiezan a contar desde este despliegue. Personas e historial ya incluyen todo lo anterior.'),
      el('div', { class: 'tiles' },
        tile('Visitantes', fmt(t.visitors), 'navegadores distintos'),
        tile('Páginas vistas', fmt(t.views)),
        tile('Registros', fmt(t.signups), 'cuentas nuevas en el periodo'),
        tile('Eventos creados', fmt(t.events)),
        tile('Personas en total', fmt(t.people), fmt(t.withEmail) + ' con correo · ' + fmt(t.news) + ' aceptan novedades')),
      el('section', { class: 'card' },
        el('div', { class: 'bar' }, el('h2', {}, 'Por día'),
          el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--series-a)' }), 'Visitantes'), el('span', {}, el('i', { style: 'background:var(--series-b)' }), 'Registros'))),
        el('div', { id: 'trend' })),
      activeSection(),
      loginSection(),
      eventsSection(),
      usageSection(),
      el('div', { class: 'grid' },
        el('section', { class: 'card' }, el('h2', {}, 'Embudo'),
          el('p', { class: 'muted small' }, 'Navegadores que visitaron, cuántos terminaron con cuenta y cuántos crearon un evento.'),
          (() => { const u = rank([
            { label: 'Visitaron', n: f.visitors }, { label: 'Tienen cuenta', n: f.registered }, { label: 'Crearon un evento', n: f.created },
          ], 'label', 'n', (r) => '· ' + pct(r.n, f.visitors)); u.classList.add('funnel'); return u })()),
        el('section', { class: 'card' }, el('h2', {}, 'De dónde llegan'),
          el('p', { class: 'muted small' }, 'Visitantes por su primera fuente, y qué parte terminó con cuenta. «Directo» incluye enlaces abiertos desde WhatsApp.'),
          rank(data.sources, 'source', 'visitors', (r) => '· ' + pct(r.registered, r.visitors) + ' con cuenta')),
        el('section', { class: 'card' }, el('h2', {}, 'Páginas más vistas'), rank(data.pages, 'page', 'views')),
        el('section', { class: 'card' }, el('h2', {}, 'Dispositivo'), rank(data.devices, 'label', 'visitors'),
          el('h2', { style: 'margin-top:8px' }, 'Región del navegador'), rank(data.regions, 'label', 'visitors')),
        data.campaigns.length ? el('section', { class: 'card' }, el('h2', {}, 'Campañas (utm_campaign)'), rank(data.campaigns, 'label', 'visitors')) : null),
      el('section', { class: 'card' },
        el('div', { class: 'bar' }, el('h2', {}, 'Personas'),
          el('div', { class: 'row' },
            el('input', { type: 'search', placeholder: 'Buscar nombre, correo, evento…', value: search, oninput: (e) => { search = e.target.value; renderPeople() } }),
            el('button', { onclick: () => download('personas') }, 'Descargar personas'))),
        peopleBox),
      el('section', { class: 'card' },
        el('div', { class: 'bar' }, el('h2', {}, 'Actividad reciente'),
          el('div', { class: 'row' },
            el('button', { onclick: () => download('historial') }, 'Descargar historial'),
            el('button', { onclick: () => download('visitas') }, 'Descargar visitas'))),
        data.recent.length
          ? el('div', { class: 'scroll' }, el('table', {}, el('tbody', {}, data.recent.map((h) =>
              el('tr', {}, el('td', { class: 'nowrap muted' }, dateTime(h.at)), el('td', {}, h.name || '—'), el('td', {}, h.kind),
                el('td', { class: 'hide-sm' }, [h.event, h.detail].filter(Boolean).join(' · ')))))))
          : el('p', { class: 'empty' }, 'Todavía no hay actividad.')),
    )
    drawTrend()
  }

  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault()
    key = document.getElementById('key').value
    if (key) load()
  })
  // El gráfico se dibuja al ancho real de su tarjeta, para que el texto no se achique en el celular.
  function drawTrend() {
    const box = document.getElementById('trend')
    if (box && data) box.replaceChildren(trend(data.daily, box.clientWidth))
    const reads = document.getElementById('reads')
    if (reads && data && data.ai) reads.replaceChildren(trend(data.ai.daily, reads.clientWidth, READS))
    const active = document.getElementById('active')
    if (active && data && data.active) active.replaceChildren(trend(data.active.daily, active.clientWidth, ACTIVE))
    const codes = document.getElementById('codes')
    if (codes && data && data.login) codes.replaceChildren(trend(data.login.daily, codes.clientWidth, CODES))
  }
  let resizeTimer
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawTrend, 150) })
  if (key) load()
})()
</script>
</body>
</html>
